services:
  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      # ホスト側 5173 → コンテナ 5173
      - "5173:5173"
    volumes:
      # ソースをバインドマウントして、編集が即座に反映されるようにする
      - ./frontend:/app
      # node_modules はホストと共有しない（OS差によるネイティブモジュールの破損を防ぐ）
      - frontend_node_modules:/app/node_modules
    environment:
      # Mac/Windows でファイル監視が効かない場合に備えてポーリングを有効化
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      # ホスト側は 5001。macOS では 5000 番を AirPlay Receiver が占有しているため
      - "5001:5000"
    volumes:
      - ./backend:/app
    environment:
      - FLASK_APP=app.py
      # コード変更時に自動リロードする
      - FLASK_DEBUG=1

volumes:
  frontend_node_modules:
